<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid px-lg-5">
    <a class="navbar-brand" href="{% url 'home' %}">Ops Apps</a>
    {% if user.is_authenticated %}
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        {% for app in ops_nav %}
        <li class="nav-item">
          <a class="nav-link{% if request.resolver_match.namespace == app.label %} active{% endif %}"
             href="{% url app.nav_url_name %}">{{ app.nav_label }}</a>
        </li>
        {% endfor %}
      </ul>
      <ul class="navbar-nav">
        {% if user.is_staff %}
        <li class="nav-item"><a class="nav-link" href="{% url 'admin:index' %}">Admin</a></li>
        {% endif %}
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
             aria-expanded="false">{{ user.get_full_name|default:user.username }}</a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="dropdown-item">Sign out</button>
              </form>
            </li>
          </ul>
        </li>
      </ul>
    </div>
    {% endif %}
  </div>
</nav>
