repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^static/vendor/
      - id: end-of-file-fixer
        exclude: ^static/vendor/
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
  # Ruff runs from the project venv so its version always matches uv.lock.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: makemigrations-check
        name: migrations up to date
        entry: uv run python manage.py makemigrations --check --dry-run
        language: system
        pass_filenames: false
        files: models\.py$
